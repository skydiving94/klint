name: klint Self-Audit
run-name: klint Audit on ${{ github.ref_name }} by @${{ github.actor }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run klint Project Structure Audit on src/
        uses: ./
        with:
          target: "src/"
          mode: "project"
          min_confidence: "0.50"
          kev_model_name: "jaredpalmer/kev-0.8b"

      - name: Run klint File Audit on src/
        uses: ./
        with:
          target: "src/"
          mode: "file"
          min_confidence: "0.75"
