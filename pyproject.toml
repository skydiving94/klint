[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "klint-auditor"
version = "0.1.0"
description = "Declarative semantic linter and architectural code auditor for local kev and System One (/v1/systemone) models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.2.0",
    # 0.23 is the first version whose multibinding accepts classes.
    "injector>=0.23",
]

# The in-process model runtime, needed only when KEV_MODE=local. Optional for
# people installing klint; developers get it through the dev group below.
# kev itself supports Python 3.12 and 3.13 only, so on other versions this
# extra installs nothing.
[project.optional-dependencies]
local = [
    "kev[serve] @ git+https://github.com/jaredpalmer/kev.git ; python_version >= '3.12' and python_version < '3.14'",
]

# Development tools. `uv sync` installs this group by default.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.10",
    "mypy>=2.4.0",
    "pre-commit>=4.0",
    "import-linter>=2.0",
    # The local model runtime, so a plain `uv sync` gives a working checkout.
    "klint-auditor[local]",
]

[project.scripts]
klint = "klint.cli.basic_audit:cli_main"
klint-project = "klint.cli.project_audit:cli_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["klint*"]

[tool.setuptools.package-data]
"klint.resources" = ["**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# A test that expects a klint warning says so; any other one is a failure.
filterwarnings = ["error::klint.core.klint_warning.KlintWarning"]

[tool.ruff]
target-version = "py311"
line-length = 88
# examples/ holds deliberately bad code for klint to find; never lint it.
# Markdown files are documentation; ruff format must not rewrite their code
# blocks, so `ruff format --check .` checks Python files only.
extend-exclude = ["examples", "*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import order
    "N",    # naming
    "UP",   # modern syntax for the target Python version
    "B",    # likely bugs
    "ANN",  # type annotations on every parameter and return
    "ARG",  # unused function arguments
    "D",    # docstring style
    "PT",   # pytest style
    "SIM",  # simplifications
    "RUF",  # ruff-specific checks
]
ignore = [
    "D1",    # docstrings are not required on every function
    "D203",  # conflicts with D211 (no blank line before a class docstring)
    "D213",  # conflicts with D212 (summary on the first docstring line)
]

[tool.mypy]
python_version = "3.11"
files = ["klint", "tests"]
# Every function must be fully annotated.
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_redundant_casts = true
warn_unused_configs = true

# tests/ is held to everything `mypy --strict` turns on. `strict` cannot be
# limited to one package, so its flags are listed: the per-package ones here,
# the rest in the main section.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
implicit_reexport = false
strict_equality = true
extra_checks = true

# The local model runtime is optional and may be absent where mypy runs;
# when it is, these imports are treated as untyped.
[[tool.mypy.overrides]]
module = ["torch.*", "kev.*", "huggingface_hub.*"]
ignore_missing_imports = true

# Checked with `uv run lint-imports`. A layer may import from the layers listed
# below it, never from one above. klint/resources holds data only.
[tool.importlinter]
root_package = "klint"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: cli > app > catalog > infra > core"
type = "layers"
layers = [
    "klint.cli",
    "klint.app",
    "klint.catalog",
    "klint.infra",
    "klint.core",
]

[[tool.importlinter.contracts]]
name = "Catalog: shared suites do not import specific ones"
type = "forbidden"
source_modules = ["klint.catalog.common"]
forbidden_modules = ["klint.catalog.code"]

[[tool.importlinter.contracts]]
name = "Catalog: code shared across languages does not import one language"
type = "forbidden"
source_modules = ["klint.catalog.code.common"]
forbidden_modules = ["klint.catalog.code.python"]
