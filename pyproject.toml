[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "klint-auditor"
version = "0.1.0"
description = "Declarative semantic linter and architectural code auditor for local kev and System One (/v1/systemone) models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.2.0",
    "injector>=0.22",
]

# The in-process model runtime, needed only when KEV_MODE=local. Optional for
# people installing klint; developers get it through the dev group below.
# kev itself supports Python 3.12 and 3.13 only, so on other versions this
# extra installs nothing.
[project.optional-dependencies]
local = [
    "kev[serve] @ git+https://github.com/jaredpalmer/kev.git ; python_version >= '3.12' and python_version < '3.14'",
]

# Development tools. `uv sync` installs this group by default.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.10",
    "mypy>=2.4.0",
    "pre-commit>=4.0",
    "import-linter>=2.0",
    # The local model runtime, so a plain `uv sync` gives a working checkout.
    "klint-auditor[local]",
]

[project.scripts]
klint = "src.cli.basic_audit:cli_main"
klint-project = "src.cli.project_audit:cli_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.resources" = ["**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 88
# examples/ holds deliberately bad code for klint to find; never lint it.
extend-exclude = ["examples"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import order
    "N",    # naming
    "UP",   # modern syntax for the target Python version
    "B",    # likely bugs
    "ANN",  # type annotations on every parameter and return
    "ARG",  # unused function arguments
    "D",    # docstring style
    "PT",   # pytest style
    "SIM",  # simplifications
    "RUF",  # ruff-specific checks
]
ignore = [
    "D1",    # docstrings are not required on every function
    "D203",  # conflicts with D211 (no blank line before a class docstring)
    "D213",  # conflicts with D212 (summary on the first docstring line)
]

[tool.mypy]
python_version = "3.11"
files = ["tests"]
strict = true

# src/ is not held to these checks yet: type-check what tests import from it,
# but do not report errors inside it.
[[tool.mypy.overrides]]
module = "src.*"
follow_imports = "silent"

# Checked with `uv run lint-imports`. A layer may import from the layers listed
# below it, never from one above. src/resources holds data only.
[tool.importlinter]
root_package = "src"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: cli > app > catalog > infra > core"
type = "layers"
layers = [
    "src.cli",
    "src.app",
    "src.catalog",
    "src.infra",
    "src.core",
]

[[tool.importlinter.contracts]]
name = "Wiring: only app uses injector"
type = "forbidden"
source_modules = ["src.cli", "src.catalog", "src.infra", "src.core"]
forbidden_modules = ["injector"]
# Using what app builds is fine; importing injector directly is not.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Catalog: shared suites do not import specific ones"
type = "forbidden"
source_modules = ["src.catalog.common"]
forbidden_modules = ["src.catalog.code"]

[[tool.importlinter.contracts]]
name = "Catalog: code shared across languages does not import one language"
type = "forbidden"
source_modules = ["src.catalog.code.common"]
forbidden_modules = ["src.catalog.code.python"]
