[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "klint-auditor"
version = "0.1.0"
description = "Declarative semantic linter and architectural code auditor for local kev and System One (/v1/systemone) models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.2.0",
    # 0.23 is the first version whose multibinding accepts classes.
    "injector>=0.23",
]

# The in-process model runtime, needed only when KLINT_JUDGE_MODE=local.
# Optional for people installing klint; developers get it through the dev
# group below.
# kev itself supports Python 3.12 and 3.13 only, so on other versions this
# extra installs nothing.
[project.optional-dependencies]
local = [
    "kev[serve] @ git+https://github.com/jaredpalmer/kev.git ; python_version >= '3.12' and python_version < '3.14'",
]

# Development tools. `uv sync` installs this group by default.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.10",
    "mypy>=2.4.0",
    "pre-commit>=4.0",
    "import-linter>=2.0",
    # The local model runtime, so a plain `uv sync` gives a working checkout.
    "klint-auditor[local]",
]

[project.scripts]
klint = "klint.cli:run_file_audit"
klint-structure = "klint.cli:run_structure_audit"
# The old name of klint-structure, kept for one release.
klint-project = "klint.cli:run_klint_project_alias"
klint-change-summary = "klint.cli:run_change_summary_audit"
# The Claude Code Stop hook that checks an agent's change summaries.
klint-change-summary-stop-hook = "klint.cli:run_change_summary_stop_hook"

[tool.setuptools.packages.find]
where = ["."]
include = ["klint*"]

[tool.setuptools.package-data]
"klint.resources" = ["**/*.json", "**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# A test that expects a klint warning says so; any other one is a failure.
filterwarnings = ["error::klint.core.klint_warning.KlintWarning"]

[tool.ruff]
target-version = "py311"
line-length = 88
# examples/ holds deliberately bad code for klint to find; never lint it.
# Markdown files are documentation; ruff format must not rewrite their code
# blocks, so `ruff format --check .` checks Python files only.
extend-exclude = ["examples", "*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import order
    "N",    # naming
    "UP",   # modern syntax for the target Python version
    "B",    # likely bugs
    "ANN",  # type annotations on every parameter and return
    "ARG",  # unused function arguments
    "D",    # docstring style
    "PT",   # pytest style
    "SIM",  # simplifications
    "RUF",  # ruff-specific checks
]
ignore = [
    "D1",    # docstrings are not required on every function
    "D203",  # conflicts with D211 (no blank line before a class docstring)
    "D213",  # conflicts with D212 (summary on the first docstring line)
]

[tool.mypy]
python_version = "3.11"
files = ["klint", "judge_accuracy", "self_audit_gate", "tests"]
# klint/ and tests/ are both held to everything `mypy --strict` turns on.
strict = true
warn_unused_configs = true

# klint/ also may not write out `Any`, so that what crosses a boundary has a
# type.
[[tool.mypy.overrides]]
module = "klint.*"
disallow_any_explicit = true

# The local model runtime is optional and may be absent where mypy runs;
# when it is, these imports are treated as untyped. huggingface_hub names
# what it re-exports only by importing it.
[[tool.mypy.overrides]]
module = ["torch.*", "kev.*", "huggingface_hub.*"]
ignore_missing_imports = true
implicit_reexport = true

# Checked with `uv run lint-imports`. A layer may import from the layers listed
# below it, never from one above. klint/resources holds data only.
[tool.importlinter]
root_package = "klint"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: cli > app > catalog > infra > core"
type = "layers"
layers = [
    "klint.cli",
    "klint.app",
    "klint.catalog",
    "klint.infra",
    "klint.core",
]

# The core holds klint's own model and the interfaces the outer layers
# implement, so it imports the standard library alone. Every top-level
# package outside klint is in the graph (include_external_packages), the
# standard library's too, and "*" matches each of them; klint itself
# overlaps klint.core and is skipped. The standard-library modules the core
# uses are let through by ignore_imports.
[[tool.importlinter.contracts]]
name = "Core: klint.core imports no third-party package"
type = "forbidden"
source_modules = ["klint.core"]
forbidden_modules = ["*"]
ignore_imports = [
    "klint.core.** -> __future__",
    "klint.core.** -> abc",
    "klint.core.** -> asyncio",
    "klint.core.** -> collections",
    "klint.core.** -> contextlib",
    "klint.core.** -> dataclasses",
    "klint.core.** -> enum",
    "klint.core.** -> pathlib",
    "klint.core.** -> typing",
    "klint.core.** -> warnings",
]
unmatched_ignore_imports_alerting = "none"
broken_contract_guidance = """
A third-party package belongs in an outer layer (klint.infra, klint.catalog
or klint.app), behind an interface in klint.core.interfaces. A module of the
standard library is let through by adding it to this contract's
ignore_imports.
"""

# A named suite is any package under klint/catalog but the domain-neutral one,
# klint.catalog.domain_neutral; each new suite is added to forbidden_modules.
# The caller of the use case chooses the suites an audit draws on.
[[tool.importlinter.contracts]]
name = "Suites: app and core import no named suite"
type = "forbidden"
source_modules = ["klint.app", "klint.core"]
forbidden_modules = ["klint.catalog.code", "klint.catalog.change_summary"]

[[tool.importlinter.contracts]]
name = "Catalog: the domain-neutral suite imports no named suite"
type = "forbidden"
source_modules = ["klint.catalog.domain_neutral"]
forbidden_modules = ["klint.catalog.code", "klint.catalog.change_summary"]

# Each named suite stands alone: what two suites share belongs in
# klint.catalog.domain_neutral.
[[tool.importlinter.contracts]]
name = "Catalog: named suites do not import one another"
type = "independence"
modules = ["klint.catalog.code", "klint.catalog.change_summary"]

[[tool.importlinter.contracts]]
name = "Catalog: language-neutral code does not import one language"
type = "forbidden"
source_modules = ["klint.catalog.code.language_neutral"]
forbidden_modules = ["klint.catalog.code.python"]
